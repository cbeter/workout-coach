</style></head><body><header><div class="eyebrow">YOUR PERSONAL TRAINING LOG</div><div class="headrow"><div><h1>Workout Coach</h1><div class="muted">Train with a plan. Track every rep.</div></div><div class="pill" id="streak">5-DAY ROTATION</div></div></header><nav class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="equipment">Equipment</button><button class="tab" data-tab="library">Exercise library</button><button class="tab" data-tab="plans">Plan editor</button><button class="tab" data-tab="history">Progress</button></nav><main class="wrap"><section id="today"></section><section id="equipment" class="hidden"></section><section id="library" class="hidden"></section><section id="plans" class="hidden"></section><section id="history" class="hidden"></section></main><div class="bottom" id="bottom"><button class="primary" id="mainAction">Start workout · 45 min</button></div><script>

const EX=[

{id:'row',n:'Barbell bent-over row',g:'Pull',eq:['barbell'],sets:3,reps:'6–10',rest:120,kind:'compound'},{id:'pulldown',n:'Lat pulldown',g:'Pull',eq:['latpulldown'],sets:3,reps:'8–12',rest:100,kind:'compound'},{id:'pullup',n:'Pull-up',g:'Pull',eq:['pullup'],sets:3,reps:'AMRAP',rest:120,kind:'compound'},{id:'dbrow',n:'One-arm dumbbell row',g:'Pull',eq:['dumbbells','bench'],sets:3,reps:'8–12 each',rest:90,kind:'compound'},{id:'seatedrow',n:'Seated cable row',g:'Pull',eq:['seatedrow'],sets:3,reps:'8–12',rest:90,kind:'compound'},{id:'facepull',n:'Cable face pull',g:'Pull',eq:['cable'],sets:2,reps:'12–20',rest:60,kind:'accessory'},{id:'curl',n:'EZ-bar curl',g:'Pull',eq:['ezbar'],sets:3,reps:'8–12',rest:60,kind:'accessory'},{id:'hammer',n:'Dumbbell hammer curl',g:'Pull',eq:['dumbbells'],sets:2,reps:'10–15',rest:60,kind:'accessory'},{id:'rdl',n:'Barbell Romanian deadlift',g:'Pull',eq:['barbell'],sets:3,reps:'6–10',rest:150,kind:'compound'},{id:'inclinecurl',n:'Incline dumbbell curl',g:'Pull',eq:['dumbbells','bench'],sets:2,reps:'10–15',rest:60,kind:'accessory'},{id:'shrug',n:'Dumbbell shrug',g:'Pull',eq:['dumbbells'],sets:2,reps:'10–15',rest:60,kind:'accessory'},

{id:'cablecurl',n:'Cable curl',g:'Pull',eq:['cable'],sets:2,reps:'10–15',rest:60,kind:'accessory'},{id:'cableoverhead',n:'Overhead cable triceps extension',g:'Push',eq:['cable'],sets:2,reps:'10–15',rest:60,kind:'accessory'}];
const PLANS=[
{label:'Full Upper',group:'Upper',ids:['bench','pulldown','dbshoulder','seatedrow','lateral','curl','triceps']},
{label:'Legs A',group:'Legs',ids:['squat','rdl','extension','legcurl','calf']},
{label:'Push',group:'Push',ids:['bench','incline','ohp','lateral','triceps']},
{label:'Pull',group:'Pull',ids:['row','pulldown','seatedrow','curl','facepull']},
{label:'Legs B',group:'Legs',ids:['deadlift','split','hipthrust','legcurl','plank']}
];
const PLAN_B=[
{label:'Full Upper B',group:'Upper',ids:['incline','row','dbshoulder','pullup','cablefly','hammer','skull']},
{label:'Legs A · B week',group:'Legs',ids:['goblet','deadlift','split','extension','calf']},
{label:'Push B',group:'Push',ids:['closebench','dbbench','dbshoulder','frontraise','cableoverhead']},
{label:'Pull B',group:'Pull',ids:['rdl','pullup','dbrow','inclinecurl','shrug']},
{label:'Legs B · B week',group:'Legs',ids:['squat','hipthrust','goodmorning','legcurl','plank']}
];
const DEFAULT={equipment:['dumbbells','barbell','ezbar','bench','rack','cable','pullup','latpulldown','seatedrow','legmachine','bodyweight','cardio','heavybag'],customEquipment:[],next:0,logs:[],active:null,custom:[],plans:JSON.parse(JSON.stringify(PLANS.concat(PLAN_B))),prefs:{duration:45,daysPerWeek:5,units:'lb'}};
let data;try{data=JSON.parse(localStorage.getItem('workoutCoachV2'))||JSON.parse(localStorage.getItem('workoutCoachV1'))||structuredClone(DEFAULT);data.equipment=[...new Set(data.equipment||DEFAULT.equipment)];data.customEquipment=data.customEquipment||[];data.custom=data.custom||[];data.prefs={...DEFAULT.prefs,...(data.prefs||{}),daysPerWeek:5};let savedPlans=Array.isArray(data.plans)&&data.plans.length?data.plans:JSON.parse(JSON.stringify(PLANS));savedPlans=savedPlans.map((p,i)=>({label:p.label||PLANS[i%PLANS.length].label,group:p.group||PLANS[i%PLANS.length].group,ids:Array.isArray(p.ids)?p.ids:(p.items||[]).map(x=>x.id).filter(Boolean)}));if(savedPlans.length<10)savedPlans=savedPlans.slice(0,5).concat(JSON.parse(JSON.stringify(PLAN_B)));data.plans=savedPlans.slice(0,10);data.next=Number(data.next)||0;}catch(e){data=JSON.parse(JSON.stringify(DEFAULT))}let page='today',timerInt=null,timerLeft=0,planVersion='A',storageOk=true;function save(){try{localStorage.setItem('workoutCoachV2',JSON.stringify(data));storageOk=true;return true}catch(e){storageOk=false;return false}}function allEquipment(){return EQUIPMENT.concat(data.customEquipment||[])}function available(){return EX.concat(data.custom||[]).filter(e=>e.eq.every(x=>data.equipment.includes(x)))}function getEx(id){return available().find(e=>e.id===id)}function hist(id){return data.logs.filter(x=>x.type==='set'&&x.exerciseId===id).sort((a,b)=>b.date.localeCompare(a.date))}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function workoutFor(i){let day=i%5,week=Math.floor(i/5)%2,plan=data.plans[week*5+day]||PLANS[day];let items=(plan.ids||[]).map(getEx).filter(Boolean);return {group:plan.group,label:plan.label,items,week:week?'B':'A',day:day+1}}function suggestion(e){let prev=hist(e.id)[0];if(!prev)return 'First session: choose a controlled weight; finish most sets with 1–3 reps in reserve.';let range=(e.reps.match(/\d+/g)||[]).map(Number),target=range.length?Math.max(...range):12;let sets=prev.sets||[];if(sets.length&&sets.every(s=>Number(s.reps)>=target&&Number(s.weight)>0))return `Progression: all logged sets reached the top of the rep range. Consider +${e.kind==='compound'?5:2.5} lb next time.`;return `Last logged: ${sets.map(s=>`${s.weight||0} lb × ${s.reps||'—'}`).join(', ')}. Try to add a rep with good form.`}function estimate(items){let seconds=240;for(const e of items)seconds+=e.sets*(e.rest+35);return Math.round(seconds/60)}function render(){document.querySelectorAll('section').forEach(s=>s.classList.toggle('hidden',s.id!==page));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));if(page==='today')renderToday();if(page==='equipment')renderEquipment();if(page==='library')renderLibrary();if(page==='plans')renderPlans();if(page==='history')renderHistory();document.getElementById('bottom').classList.toggle('hidden',page!=='today');document.getElementById('mainAction').textContent=data.active?'Finish workout':'Start workout · 45 min';document.getElementById('streak').textContent=`${data.logs.filter(x=>x.type==='set').length} SETS`}
function renderToday(){let root=document.getElementById('today');if(data.active){let w=data.active,total=w.items.reduce((n,e)=>n+e.sets,0),done=w.items.reduce((n,e)=>n+e.done.filter(Boolean).length,0);root.innerHTML=`<div class="card hero"><div class="eyebrow">WORKOUT IN PROGRESS · ${w.label}</div><div class="splitline"><div><div class="big">${w.group} Day</div><div class="muted">Started ${new Date(w.started).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></div><div class="pill">${done}/${total} sets</div></div><div class="bar"><div style="width:${total?done/total*100:0}%"></div></div><div class="timerbox"><div class="muted" style="text-align:center">REST TIMER</div><div class="timer" id="timer">${fmt(timerLeft)}</div><div class="btnrow"><button class="secondary" onclick="startTimer(60)">60 sec</button><button class="secondary" onclick="startTimer(90)">90 sec</button><button class="secondary" onclick="startTimer(150)">150 sec</button><button class="secondary" onclick="stopTimer()">Stop</button></div></div></div>`+w.items.map((e,ei)=>`<div class="card"><div class="splitline"><div><h3>${ei+1}. ${e.n}</h3><div class="muted">${e.sets} sets · ${e.reps} reps · ${fmt(e.rest)} rest</div></div><span class="pill">${e.done.filter(Boolean).length}/${e.sets}</span></div><div class="muted" style="margin:8px 0">${suggestion(e)}</div><div class="setrow"><label>SET</label><label>WEIGHT (LB)</label><label>REPS</label><label>RPE*</label><label>DONE</label></div>`+Array.from({length:e.sets},(_,si)=>{let s=e.entries[si]||{weight:'',reps:'',rpe:'',done:false};return `<div class="setrow"><div class="setnum">${si+1}</div><input aria-label="weight" type="number" inputmode="decimal" placeholder="lb" value="${s.weight}" onchange="editSet(${ei},${si},'weight',this.value)"><input aria-label="reps" type="number" inputmode="numeric" placeholder="reps" value="${s.reps}" onchange="editSet(${ei},${si},'reps',this.value)"><input aria-label="RPE" type="number" min="1" max="10" inputmode="numeric" placeholder="—" value="${s.rpe}" onchange="editSet(${ei},${si},'rpe',this.value)"><button class="done ${s.done?'checked':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'○'}</button></div>`}).join('')+`<div class="btnrow"><button class="secondary" onclick="startTimer(${e.rest})">Rest ${fmt(e.rest)}</button><button class="secondary" onclick="swapExercise(${ei})">Swap exercise</button></div></div>`).join('')+`<div class="card"><h3>*RPE is optional</h3><div class="muted">Completed sets and the active workout are saved locally in this browser. Finish the session to record it and advance the rotation.</div></div>`;return}
let w=workoutFor(data.next),items=w.items,mins=estimate(items);root.innerHTML=`<div class="card hero"><div class="eyebrow">WEEK ${w.week} · DAY ${w.day} · SESSION ${data.next+1}</div><div class="splitline"><div><div class="big">${w.label}</div><div class="muted">${new Date().toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}</div></div><div style="text-align:right"><div class="big">45</div><div class="muted">MIN TARGET</div></div></div><div class="statrow"><div class="stat"><b>${items.length}</b><span>Exercises</span></div><div class="stat"><b>${items.reduce((n,e)=>n+e.sets,0)}</b><span>Working sets</span></div><div class="stat"><b>${data.logs.filter(x=>x.type==='set').length}</b><span>Logged sets</span></div></div><div class="notice">Estimated ${mins} min including rest and setup. Aim for the 45-minute target; actual time varies with transitions and set duration.</div></div>`+(items.length?items.map((e,i)=>`<div class="card"><div class="splitline"><h3>${i+1}. ${e.n}</h3><span class="pill">${e.kind==='compound'?'COMPOUND':'ACCESSORY'}</span></div><div class="tags"><span class="tag">${e.sets} sets</span><span class="tag">${e.reps} reps</span><span class="tag">${fmt(e.rest)} rest</span></div><div class="muted">${suggestion(e)}</div></div>`).join(''):`<div class="card empty">Some exercises in this plan require equipment that is turned off. Select it in Equipment to complete the plan.</div>`)+`<div class="card"><h3>5-workout rotation</h3><div class="muted">Week A and Week B alternate every five completed workouts: Full Upper → Legs A → Push → Pull → Legs B. Week B uses different exercise variations. Edit either version in Plan editor. Take rest days whenever needed; the app advances only when you finish a workout.</div><div class="btnrow"><button class="secondary" onclick="skipDay()">Skip this workout</button></div></div>`}
function renderEquipment(){let root=document.getElementById('equipment');root.innerHTML=`<div class="card"><h2>Your equipment</h2><p class="muted">Toggle built-in equipment or add your own. Custom equipment is saved on this device and can be attached to custom exercises.</p><div class="equipment-grid">${allEquipment().map(([id,n])=>`<label class="equip"><input type="checkbox" ${data.equipment.includes(id)?'checked':''} onchange="setEquipment('${id}',this.checked)"><span>${n}</span></label>`).join('')}</div><div class="btnrow"><button class="primary" onclick="save();render();">Save equipment</button><button class="secondary" onclick="addEquipment()">+ Add equipment</button></div></div><div class="card"><h3>Add equipment</h3><p class="muted">Examples: preacher curl bench, Smith machine, dip belt, ankle strap, resistance bands.</p><div class="btnrow"><input id="newEquipmentName" placeholder="Equipment name" maxlength="60"><button class="primary" onclick="addEquipmentFromField()">Add</button></div></div><div class="card"><h3>Training setup</h3><p class="muted">5 workout days in your rotation. The rotation is continuous rather than tied to weekdays, so a missed day won't reset your sequence.</p></div>`}
function addEquipment(){let name=prompt('What equipment would you like to add?');if(name)addEquipmentName(name)}function addEquipmentFromField(){let el=document.getElementById('newEquipmentName');if(el&&el.value.trim())addEquipmentName(el.value)}function addEquipmentName(name){name=String(name).trim();if(!name)return;let id='customgear_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');if(allEquipment().some(x=>x[0]===id)){alert('That equipment is already in your list.');return}data.customEquipment.push([id,name]);data.equipment.push(id);save();renderEquipment()}
function renderLibrary(){let root=document.getElementById('library'),groups=['Push','Pull','Legs','Upper','Core','Cardio'],eq=allEquipment();root.innerHTML=`<div class="card"><h2>Exercise library</h2><p class="muted">${available().length} compatible exercises. Add your own exercises at any time; choose the equipment they require so workouts only offer movements you can do.</p><button class="primary" onclick="showExerciseForm()">+ Add exercise</button></div><div id="exerciseForm"></div>`+groups.map(g=>`<div class="card"><h2>${g}</h2>`+(available().filter(e=>e.g===g).length?available().filter(e=>e.g===g).map(e=>`<div class="exercise"><div class="splitline"><h3>${e.n}</h3><span class="tag">${e.sets} × ${e.reps}</span></div><div class="tags">${e.eq.map(id=>`<span class="tag">${(eq.find(x=>x[0]===id)||[id,id])[1]}</span>`).join('')}<span class="tag">Rest ${fmt(e.rest)}</span>${(data.custom||[]).some(x=>x.id===e.id)?'<span class="tag">CUSTOM</span>':''}</div><div class="muted">${suggestion(e)}</div>${(data.custom||[]).some(x=>x.id===e.id)?`<div class="btnrow"><button class="secondary" onclick="deleteCustomExercise('${e.id}')">Remove custom exercise</button></div>`:''}</div>`).join(''):`<div class="empty">No matching exercises. Select more equipment.</div>`)+`</div>`).join('')+`<div class="card"><h3>Training note</h3><p class="muted">Custom exercises are added to your library immediately. Use Plan editor to add it to any workout day.</p></div>`}
function showExerciseForm(){let host=document.getElementById('exerciseForm');if(!host)return;host.innerHTML=`<div class="card"><h2>Add a custom exercise</h2><div style="display:grid;gap:10px"><label class="muted">Exercise name<input id="ceName" placeholder="e.g. Single-arm cable lateral raise" maxlength="80"></label><label class="muted">Muscle group<select id="ceGroup"><option>Push</option><option>Pull</option><option>Legs</option><option>Upper</option><option>Core</option><option>Cardio</option></select></label><label class="muted">Working sets<input id="ceSets" type="number" min="1" max="8" value="3"></label><label class="muted">Rep target<input id="ceReps" value="8–12" maxlength="30"></label><label class="muted">Rest between sets (seconds)<input id="ceRest" type="number" min="0" max="600" value="75"></label><label class="muted">Exercise type<select id="ceKind"><option value="accessory">Accessory</option><option value="compound">Compound</option></select></label><div><div style="font-weight:700;margin-bottom:8px">Required equipment</div><div class="equipment-grid">${eqListForForm()}</div></div><div class="btnrow"><button class="primary" onclick="saveCustomExercise()">Save exercise</button><button class="secondary" onclick="document.getElementById('exerciseForm').innerHTML=''">Cancel</button></div></div></div>`;host.scrollIntoView({behavior:'smooth',block:'start'})}
function eqListForForm(){return allEquipment().map(([id,n])=>`<label class="equip"><input type="checkbox" name="ceEq" value="${id}" ${data.equipment.includes(id)?'checked':''}><span>${n}</span></label>`).join('')}
function saveCustomExercise(){let name=document.getElementById('ceName').value.trim(),g=document.getElementById('ceGroup').value,sets=Math.max(1,Math.min(8,Number(document.getElementById('ceSets').value)||3)),reps=document.getElementById('ceReps').value.trim()||'8–12',rest=Math.max(0,Math.min(600,Number(document.getElementById('ceRest').value)||0)),kind=document.getElementById('ceKind').value,eq=[...document.querySelectorAll('input[name="ceEq"]:checked')].map(x=>x.value);if(!name){alert('Enter an exercise name.');return}if(!eq.length){alert('Select at least one required equipment item. For bodyweight movements, select Bodyweight / floor space.');return}let id='customex_'+Date.now().toString(36);data.custom.push({id,n:name,g,eq,sets,reps,rest,kind});save();renderLibrary();alert('Exercise added to your library.')}
function deleteCustomExercise(id){if(!confirm('Remove this custom exercise from your library? Existing workout history will remain.'))return;data.custom=data.custom.filter(e=>e.id!==id);save();renderLibrary()}
function renderPlans(){let root=document.getElementById('plans'),all=EX.concat(data.custom||[]),offset=planVersion==='B'?5:0,planList=(data.plans||[]).slice(offset,offset+5);root.innerHTML=`<div class="card hero"><div class="eyebrow">BUILD YOUR ROUTINE</div><h2>Alternating 5-day plans</h2><p class="muted">Week A and Week B alternate after every five completed workouts. Customize each version independently; weights and reps remain tracked by exercise across both versions.</p><div class="notice">Rotation: Full Upper → Legs A → Push → Pull → Legs B. Finish five workouts to switch from Week A to Week B, regardless of rest days.</div><div class="btnrow"><button class="${planVersion==='A'?'primary':'secondary'}" onclick="planVersion='A';renderPlans()">Edit Week A</button><button class="${planVersion==='B'?'primary':'secondary'}" onclick="planVersion='B';renderPlans()">Edit Week B</button></div></div>`+planList.map((p,pi)=>{let realIndex=offset+pi,ids=new Set(p.ids||[]);return `<div class="card"><div class="splitline"><h2>Day ${pi+1} · ${escapeAttr(planVersion)}</h2><span class="pill">${(p.ids||[]).length} exercises</span></div><label class="muted">Workout name<input id="planName${pi}" maxlength="50" value="${escapeAttr(p.label)}" onchange="updatePlanMeta(${realIndex},${pi})"></label><label class="muted" style="display:block;margin-top:10px">Workout focus<select id="planGroup${pi}" onchange="updatePlanMeta(${realIndex},${pi})">${['Upper','Push','Pull','Legs','Core','Cardio'].map(g=>`<option ${p.group===g?'selected':''}>${g}</option>`).join('')}</select></label><h3 style="margin-top:16px">Choose exercises</h3><p class="muted">Selected exercises use their default sets, rep targets, and rest times from the library.</p><div style="display:grid;gap:7px">${all.map(e=>`<label class="equip"><input type="checkbox" ${ids.has(e.id)?'checked':''} ${e.eq.every(id=>data.equipment.includes(id))||ids.has(e.id)?'':'disabled'} onchange="togglePlanExercise(${realIndex},'${e.id}',this.checked)"><span>${e.n}<small style="display:block;color:var(--muted)">${e.g} · ${e.sets} × ${e.reps}${e.eq.every(id=>data.equipment.includes(id))?'':' · equipment off'}</small></span></label>`).join('')}</div><div class="btnrow"><button class="secondary" onclick="movePlan(${realIndex},-1)" ${pi===0?'disabled':''}>Move day up</button><button class="secondary" onclick="movePlan(${realIndex},1)" ${pi===4?'disabled':''}>Move day down</button></div></div>`}).join('')+`<div class="card"><h3>Plan controls</h3><div class="btnrow"><button class="primary" onclick="save();renderPlans();alert('Workout plans saved.')">Save plans</button><button class="secondary" onclick="resetPlans()">Restore both default weeks</button></div><p class="muted">Completed workout history is preserved when you edit the plan.</p></div>`}
function escapeAttr(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function updatePlanMeta(realIndex,visibleIndex){let p=data.plans[realIndex];p.label=document.getElementById('planName'+visibleIndex).value.trim()||`Workout ${visibleIndex+1}`;p.group=document.getElementById('planGroup'+visibleIndex).value;save()}
function togglePlanExercise(pi,id,on){let p=data.plans[pi];p.ids=p.ids||[];if(on){if(!p.ids.includes(id))p.ids.push(id)}else p.ids=p.ids.filter(x=>x!==id);save();renderPlans()}
function movePlan(i,dir){let base=planVersion==='B'?5:0,j=i+dir;if(j<base||j>=base+5)return;[data.plans[i],data.plans[j]]=[data.plans[j],data.plans[i]];save();renderPlans()}
function resetPlans(){if(!confirm('Restore both default Week A and Week B plans? This will not delete workout history.'))return;data.plans=JSON.parse(JSON.stringify(PLANS.concat(PLAN_B)));data.next=0;save();renderPlans()}
function renderHistory(){let root=document.getElementById('history'),sessions=data.logs.filter(x=>x.type==='session'),lifts=[...new Set(data.logs.filter(x=>x.type==='set'&&x.exerciseId).map(x=>x.exerciseId))];root.innerHTML=`<div class="card hero"><div class="eyebrow">YOUR TRAINING DATA</div><h2>Progress at a glance</h2><div class="statrow"><div class="stat"><b>${sessions.length}</b><span>Workouts</span></div><div class="stat"><b>${data.logs.filter(x=>x.type==='set').length}</b><span>Sets logged</span></div><div class="stat"><b>${lifts.length}</b><span>Lifts tracked</span></div></div></div>`+(sessions.length?sessions.slice().reverse().map(s=>`<div class="card"><div class="splitline"><h3>${s.label||s.group+' Day'}</h3><span class="muted">${new Date(s.date).toLocaleDateString()}</span></div><div class="muted">${s.setCount} sets recorded · ${s.duration||'—'} minutes</div></div>`).join(''):`<div class="card empty">Your history will appear here after you finish your first workout.</div>`)+`<div class="card"><h2>Lift history</h2>`+(lifts.length?lifts.map(id=>{let e=EX.concat(data.custom||[]).find(x=>x.id===id),h=hist(id);return e?`<div class="exercise"><h3>${e.n}</h3><div class="muted">${h.slice(0,5).map(x=>`${new Date(x.date).toLocaleDateString()}: ${x.sets.map(s=>`${s.weight||0}×${s.reps||0}`).join(' / ')}`).join('<br>')}</div></div>`:''}).join(''):`<div class="muted">No lift data yet.</div>`)+`</div><div class="card"><h3>Data backup & storage</h3><div class="notice">${storageOk?'Local save is working in this browser.':'Warning: browser storage failed. Export a backup immediately if possible.'}</div><div class="btnrow"><button class="primary" onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('backupFile').click()">Import backup</button></div><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importDataFile(this)"><p class="muted">Your data is saved to this browser on this device—not automatically to the cloud. Export a JSON backup weekly and before changing browsers/devices. Import a previous JSON backup to restore it.</p><div class="btnrow"><button class="danger" onclick="resetData()">Reset all data</button></div></div>`}
function startWorkout(){if(data.active)return;let w=workoutFor(data.next);if(!w.items.length){alert('No exercises in this plan match your selected equipment. Enable the required equipment first.');return}data.active={group:w.group,label:w.label,started:new Date().toISOString(),items:w.items.map(e=>({...e,done:Array(e.sets).fill(false),entries:Array.from({length:e.sets},()=>({weight:'',reps:'',rpe:'',done:false}))}))};save();render()}
function editSet(ei,si,k,v){let s=data.active.items[ei].entries[si];s[k]=v;save()}
function toggleSet(ei,si){let e=data.active.items[ei],s=e.entries[si];s.done=!s.done;e.done[si]=s.done;if(s.done){data.logs.push({type:'set',exerciseId:e.id,exerciseName:e.n,date:new Date().toISOString(),sets:[{weight:s.weight,reps:s.reps,rpe:s.rpe}]});startTimer(e.rest)}else{let idx=data.logs.findLastIndex(x=>x.type==='set'&&x.exerciseId===e.id&&x.sets[0].weight===s.weight&&x.sets[0].reps===s.reps);if(idx>=0)data.logs.splice(idx,1)}save();render()}
function startTimer(s){clearInterval(timerInt);timerLeft=s;renderTimer();timerInt=setInterval(()=>{timerLeft--;renderTimer();if(timerLeft<=0){clearInterval(timerInt);if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}function renderTimer(){let el=document.getElementById('timer');if(el)el.textContent=fmt(Math.max(0,timerLeft))}function stopTimer(){clearInterval(timerInt);timerLeft=0;renderTimer()}
function swapExercise(ei){let e=data.active.items[ei],opts=available().filter(x=>x.g===e.g&&x.id!==e.id&&!data.active.items.some(y=>y.id===x.id));if(!opts.length){alert('No alternative exercise for this group matches your equipment.');return}let choice=prompt('Replace with:\n'+opts.map((x,i)=>`${i+1}. ${x.n}`).join('\n'),'1');let n=Number(choice)-1;if(Number.isInteger(n)&&opts[n]){let x=opts[n];data.active.items[ei]={...x,done:Array(x.sets).fill(false),entries:Array.from({length:x.sets},()=>({weight:'',reps:'',rpe:'',done:false}))};save();render()}}
function finishWorkout(){if(!data.active)return;let w=data.active,sets=w.items.reduce((n,e)=>n+e.entries.filter(s=>s.done).length,0),duration=Math.max(1,Math.round((Date.now()-new Date(w.started).getTime())/60000));data.logs.push({type:'session',group:w.group,label:w.label,date:new Date().toISOString(),setCount:sets,duration});data.active=null;data.next++;save();stopTimer();render();alert(`Workout saved! ${sets} sets logged in ${duration} minutes.`)}function skipDay(){data.next++;save();render()}
function setEquipment(id,on){data.equipment=on?[...new Set([...data.equipment,id])]:data.equipment.filter(x=>x!==id);save();render()}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workout-coach-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}function importDataFile(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let incoming=JSON.parse(reader.result);if(!incoming||!Array.isArray(incoming.logs)||!Array.isArray(incoming.plans))throw new Error('This does not look like a Workout Coach backup.');if(!confirm('Import this backup and replace the data currently in this browser? Export your current data first if you want to keep it.')){input.value='';return}data={...structuredClone(DEFAULT),...incoming};data.plans=(data.plans.length>=10?data.plans.slice(0,10):data.plans.slice(0,5).concat(JSON.parse(JSON.stringify(PLAN_B))));data.customEquipment=data.customEquipment||[];data.custom=data.custom||[];data.equipment=data.equipment||DEFAULT.equipment;save();render();alert(storageOk?'Backup restored.':'Backup loaded in memory, but browser storage failed. Export it again and do not close this tab.')}catch(e){alert('Could not import backup: '+e.message)}input.value=''};reader.readAsText(file)}function resetData(){if(confirm('Delete all workout history, equipment settings, and current workout? Export a backup first if needed.')){localStorage.removeItem('workoutCoachV2');localStorage.removeItem('workoutCoachV1');data=JSON.parse(JSON.stringify(DEFAULT));save();render()}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.tab;render()}));document.getElementById('mainAction').addEventListener('click',()=>data.active?finishWorkout():startWorkout());save();render();
</script></body></html>
